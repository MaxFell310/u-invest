<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Відновлення пароля U-Invest." />
    <meta name="u-invest-site-root" content="../../" />
    <title>Відновлення пароля | U-Invest</title>
    <link rel="icon" type="image/jpeg" href="../../logo/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/shared/api-config.js" defer></script>
    <script src="../../assets/js/shared/supabase-config.js" defer></script>
    <script src="../../assets/js/shared/site.js" defer></script>
    <script src="../../assets/js/pages/auth.js" defer></script>
  </head>
  <body>
    <div data-site-header aria-busy="true"></div>
    <main class="section auth-section">
      <div class="container auth-container">
        <span class="eyebrow">Безпека акаунта</span>
        <h1>Новий пароль</h1>
        <p class="form-status" data-auth-status role="status" aria-live="polite"></p>
        <form class="feedback-form auth-form" data-reset-form hidden>
          <label>Новий пароль<input type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
          <label>Повторіть пароль<input type="password" name="passwordConfirmation" autocomplete="new-password" minlength="8" required /></label>
          <button class="btn btn-primary" type="submit">Зберегти пароль</button>
        </form>
        <p class="auth-switch"><a href="login.html">Повернутися до входу</a></p>
      </div>
    </main>
  </body>
</html>
