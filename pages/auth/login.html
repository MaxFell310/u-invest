<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вхід до особистого кабінету U-Invest." />
    <meta name="u-invest-site-root" content="../../" />
    <title>Вхід | U-Invest</title>
    <link rel="icon" type="image/jpeg" href="../../logo/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/shared/api-config.js" defer></script>
    <script src="../../assets/js/shared/supabase-config.js" defer></script>
    <script src="../../assets/js/shared/site.js" defer></script>
    <script src="../../assets/js/pages/auth.js" defer></script>
  </head>
  <body>
    <div data-site-header aria-busy="true"></div>
    <main class="section auth-section">
      <div class="container auth-container">
        <span class="eyebrow">Особистий кабінет U-Invest</span>
        <h1>Увійти</h1>
        <p>Використовуйте свою адресу електронної пошти та пароль.</p>
        <p class="form-status" data-auth-status role="status" aria-live="polite" hidden></p>
        <form class="feedback-form auth-form" data-auth-form data-auth-mode="login">
          <label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required /></label>
          <label>Пароль<input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="btn btn-primary" type="submit">Увійти</button>
        </form>
        <details class="recovery-details">
          <summary>Забули пароль?</summary>
          <form class="feedback-form" data-recovery-form>
            <label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required /></label>
            <button class="btn btn-secondary" type="submit">Надіслати посилання для відновлення</button>
          </form>
        </details>
        <p class="auth-switch">Ще не маєте акаунта? <a href="register.html">Зареєструватися</a></p>
        <p class="demo-notice">Демо / Віртуальний портфель. Реальних платежів та біржових угод немає.</p>
      </div>
    </main>
  </body>
</html>
