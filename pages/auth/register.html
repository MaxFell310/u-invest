<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Створення акаунта U-Invest." />
    <meta name="u-invest-site-root" content="../../" />
    <title>Реєстрація | U-Invest</title>
    <link rel="icon" type="image/jpeg" href="../../logo/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/shared/api-config.js" defer></script>
    <script src="../../assets/js/shared/supabase-config.js" defer></script>
    <script src="../../assets/js/shared/site.js" defer></script>
    <script src="../../assets/js/pages/auth.js" defer></script>
  </head>
  <body>
    <div data-site-header aria-busy="true"></div>
    <main class="section auth-section">
      <div class="container auth-container">
        <span class="eyebrow">Демо / Віртуальний портфель</span>
        <h1>Створити акаунт</h1>
        <p class="form-status" data-auth-status role="status" aria-live="polite" hidden></p>
        <form class="feedback-form auth-form" data-auth-form data-auth-mode="register">
          <label>Ім’я користувача<input type="text" name="username" autocomplete="name" minlength="2" maxlength="80" required /></label>
          <label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required /></label>
          <label>Пароль<input type="password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint" /></label>
          <small id="password-hint" class="feedback-hint">Не менше 8 символів, великі й малі латинські літери та цифра.</small>
          <label>Повторіть пароль<input type="password" name="passwordConfirmation" autocomplete="new-password" minlength="8" required /></label>
          <button class="btn btn-primary" type="submit">Створити акаунт</button>
        </form>
        <p class="auth-switch">Вже маєте акаунт? <a href="login.html">Увійти</a></p>
        <p class="demo-notice">Це навчальний симулятор. Жодних реальних платежів або купівлі акцій не відбувається.</p>
      </div>
    </main>
  </body>
</html>
